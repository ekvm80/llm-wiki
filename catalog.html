<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalog — LLM Wiki</title>
<link rel="stylesheet" href="assets/style.css?v=f08bc49e">
<style>
  .filters{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
  #q{flex:1; min-width:230px}
  #count{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  th[data-k]{cursor:pointer; user-select:none; white-space:nowrap}
  th[data-k]:hover{background:#e8eef6}
  th .arrow{font-size:9px; color:var(--accent); margin-left:3px}
  td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  td.jr{font-size:12.5px; color:var(--muted); max-width:190px}
  .excerpt{font-size:12.5px; color:var(--muted); line-height:1.55; margin:3px 0}
  #rows td:nth-child(2){min-width:340px}
  #pager{display:flex; gap:11px; align-items:center; justify-content:center; padding:6px 0 2px}
</style>
</head>
<body>

<main>
  <div class="card">
    <div class="filters">
      <input type="search" id="q" data-i18n-ph="cat.search" autocomplete="off">
      <select id="type"></select>
      <select id="tag"></select>
      <select id="year"></select>
      <button class="btn" id="reset" data-i18n="cat.reset"></button>
      <span id="count"></span>
    </div>
  </div>

  <div class="tbl-wrap" id="tbl">
    <table>
      <thead>
        <tr>
          <th data-k="ty"><span data-i18n="cat.colType"></span><span class="arrow"></span></th>
          <th data-k="t"><span data-i18n="cat.colTitle"></span><span class="arrow"></span></th>
          <th data-k="y"><span data-i18n="cat.colYear"></span><span class="arrow"></span></th>
          <th data-i18n="cat.colJournal"></th>
          <th data-k="g"><span data-i18n="cat.colLinks"></span><span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="5" class="spinner"></td></tr></tbody>
    </table>
  </div>
  <div id="pager"></div>
</main>

<script type="module" src="assets/catalog.js?v=f08bc49e"></script>
</body>
</html>
